<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Stage Details | Kalolsavam 2026</title>
  
  <meta name="theme-color" content="#090d16">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
  <link rel="apple-touch-icon" href="images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <style>
    .stage-hero-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .stage-hero-img-wrap {
      height: 160px;
      position: relative;
      background: #111827;
    }
    .stage-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.75;
    }
    .stage-hero-details {
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    @media (min-width: 640px) {
      .stage-hero-details {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.35rem 0.65rem;
      background: var(--tag-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      transition: var(--transition);
    }
    .back-nav-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-medium);
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand">
        <img src="images/logo.jpeg" alt="Logo" class="brand-logo">
        <div class="brand-info">
          <h1>Kalolsavam 2026</h1>
          <span>Thrissur • Jan 14–18</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="index.html" class="back-nav-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>All Stages</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="stage-hero-box">
      <div class="stage-hero-img-wrap">
        <img id="stageHeroImg" src="images/home.jpeg" alt="Stage Cover" class="stage-hero-img">
        <div id="stageBadgeText" class="stage-id-pill" style="top: 10px; left: 10px;">Stage</div>
      </div>
      <div class="stage-hero-details">
        <div>
          <h2 id="stageName" style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary);">Loading Stage...</h2>
          <p id="stageLocation" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px;">Loading Location...</p>
        </div>
        <div style="display: flex; gap: 0.4rem;">
          <a id="mapBtn" href="#" target="_blank" rel="noopener" class="btn-modal-primary" style="width: auto; padding: 0.45rem 0.85rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>Navigate</span>
          </a>
          <button id="shareStageBtn" class="btn-modal-secondary" style="padding: 0.45rem 0.85rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            <span>Share</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Day Segmented Controls -->
    <div class="section-head">
      <h3 class="section-title" style="font-size: 0.95rem;">Day Schedule</h3>
    </div>

    <div id="stageDayPills" class="filter-scroll" style="margin-bottom: 1rem;">
      <button class="filter-chip active" onclick="loadStageDay(1)">Day 1 (Jan 14)</button>
      <button class="filter-chip" onclick="loadStageDay(2)">Day 2 (Jan 15)</button>
      <button class="filter-chip" onclick="loadStageDay(3)">Day 3 (Jan 16)</button>
      <button class="filter-chip" onclick="loadStageDay(4)">Day 4 (Jan 17)</button>
      <button class="filter-chip" onclick="loadStageDay(5)">Day 5 (Jan 18)</button>
    </div>

    <!-- Program list -->
    <div id="programList" class="prog-list">
      <div class="empty-box">Loading programs...</div>
    </div>
  </main>

  <div id="toastWrap" class="toast-wrap"></div>

  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-text">
        © 2026 Kerala School Kalolsavam, Thrissur.
      </div>
      <div class="footer-credits">
        Developed by <strong>Arjun K M, Ajith Varghese T H & Shalvin Shabu</strong>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const stageId = parseInt(params.get("id") || params.get("stage") || "1");
    let selectedDay = parseInt(params.get("day") || "1");

    const stage = eventData.stages.find(s => s.id === stageId) || eventData.stages[0];

    if (stage) {
      document.title = `${stage.name} | Kalolsavam 2026`;
      const numStr = stage.id < 10 ? `0${stage.id}` : `${stage.id}`;
      document.getElementById("stageBadgeText").innerText = `Stage ${numStr}`;
      document.getElementById("stageName").innerText = stage.name;
      document.getElementById("stageLocation").innerText = stage.location;
      document.getElementById("mapBtn").href = stage.mapUrl;
      document.getElementById("stageHeroImg").src = `images/${stage.id}.jpeg`;

      document.getElementById("shareStageBtn").onclick = () => {
        if (navigator.share) {
          navigator.share({ title: `${stage.name} - Kalotsavam 2026`, text: `${stage.name} (${stage.location}), Thrissur:`, url: window.location.href }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Stage link copied");
        }
      };
    }

    function showToast(message) {
      const container = document.getElementById('toastWrap');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 200);
      }, 2000);
    }

    const bookmarkedEvents = new Set(JSON.parse(localStorage.getItem('kalotsav_bookmarks_2026') || '[]'));

    function getEventKey(event) {
      return `${event.stageId}_${event.day}_${event.time}_${event.program}`.replace(/\s+/g, '_');
    }

    function toggleBookmarkStagePage(key, btnElem) {
      if (bookmarkedEvents.has(key)) {
        bookmarkedEvents.delete(key);
        showToast("Removed from saved list");
      } else {
        bookmarkedEvents.add(key);
        showToast("Saved to your list");
      }
      localStorage.setItem('kalotsav_bookmarks_2026', JSON.stringify(Array.from(bookmarkedEvents)));
      
      const isSaved = bookmarkedEvents.has(key);
      if (btnElem) {
        btnElem.classList.toggle('saved', isSaved);
        const svg = btnElem.querySelector('svg');
        if (svg) svg.setAttribute('fill', isSaved ? 'currentColor' : 'none');
      }
    }

    function loadStageDay(day) {
      selectedDay = day;
      const buttons = document.querySelectorAll("#stageDayPills button");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === day - 1);
      });

      const list = document.getElementById("programList");
      list.innerHTML = "";

      const programs = eventData.schedule.filter(s => s.stageId === stageId && s.day === day);

      if (programs.length === 0) {
        list.innerHTML = `
          <div class="empty-box">
            <h3>No programs on this day</h3>
            <p>Select another day to see scheduled performances.</p>
          </div>
        `;
        return;
      }

      programs.forEach(prog => {
        const key = getEventKey(prog);
        const isSaved = bookmarkedEvents.has(key);
        const row = document.createElement("div");
        row.className = "prog-item";
        row.innerHTML = `
          <div class="prog-info-col">
            <span class="prog-time-chip">${prog.time}</span>
            <div class="prog-title-text">${prog.program}</div>
          </div>
          <button class="btn-star ${isSaved ? 'saved' : ''}" onclick="toggleBookmarkStagePage('${key}', this)" title="${isSaved ? 'Remove' : 'Save'}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          </button>
        `;
        list.appendChild(row);
      });
    }

    loadStageDay(selectedDay);
  </script>
</body>
</html>
